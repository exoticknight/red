<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">03  CSV 日期导出案例</title><desc id="desc">谁在读取导出文件？ 哪些解析器依赖原格式？ 注明未覆盖的消费者 获准增加显式选项 保留默认导出行为 验证默认路径与新路径 默认：YYYY-MM-DD 显式选择：本地格式 记录区域来源与示例 研究结果 → 授权推进 → E 验证结果 → 接受结果 → D</desc><rect width="1200" height="610" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><text x="40" y="46" font-size="16" font-weight="700" fill="#60717D">RED  /  RESEARCH · EVOLVE · DOCUMENT</text><text x="40" y="100" font-size="34" font-weight="700" fill="#182831">03  CSV 日期导出案例</text><rect x="40" y="160" width="360" height="280" rx="16" fill="#EEF5F8" stroke="#276078" stroke-width="2"/><text x="64" y="208" font-size="30" font-weight="700" fill="#276078">R · 下游依赖调查</text><text x="64" y="252" font-size="22" font-weight="400" fill="#26333D">谁在读取导出文件？</text><text x="64" y="286" font-size="22" font-weight="400" fill="#26333D">哪些解析器依赖原格式？</text><text x="64" y="320" font-size="22" font-weight="400" fill="#26333D">注明未覆盖的消费者</text><rect x="420" y="160" width="360" height="280" rx="16" fill="#FCF4EA" stroke="#9A5718" stroke-width="2"/><text x="444" y="208" font-size="30" font-weight="700" fill="#9A5718">E · 可选格式改动</text><text x="444" y="252" font-size="22" font-weight="400" fill="#26333D">获准增加显式选项</text><text x="444" y="286" font-size="22" font-weight="400" fill="#26333D">保留默认导出行为</text><text x="444" y="320" font-size="22" font-weight="400" fill="#26333D">验证默认路径与新路径</text><rect x="800" y="160" width="360" height="280" rx="16" fill="#FBEEF0" stroke="#AD2432" stroke-width="2"/><text x="824" y="208" font-size="30" font-weight="700" fill="#AD2432">D · 已接受的规则</text><text x="824" y="252" font-size="22" font-weight="400" fill="#26333D">默认：YYYY-MM-DD</text><text x="824" y="286" font-size="22" font-weight="400" fill="#26333D">显式选择：本地格式</text><text x="824" y="320" font-size="22" font-weight="400" fill="#26333D">记录区域来源与示例</text><text x="40" y="500" font-size="24" font-weight="4