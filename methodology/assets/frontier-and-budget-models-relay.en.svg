<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc"><title id="title">Hand off through docs, not chats</title><desc id="desc">The premium model decides, orchestrates and reviews; the budget model executes. Both read from and write back to the project&#x27;s R, E and D, never handing off through a chat.</desc><rect width="720" height="1040" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><rect x="40.0" y="44.8" width="5.4" height="9.0" rx="1.4" fill="#C1121F" opacity="0.35"/><rect x="47.2" y="39.4" width="5.4" height="14.4" rx="1.4" fill="#C1121F" opacity="0.65"/><rect x="54.4" y="34.0" width="5.4" height="19.8" rx="1.4" fill="#C1121F" opacity="1"/><text x="76" y="52" font-size="18" font-weight="700" text-anchor="start"><tspan fill="#60717D">Frontier to start, budget to carry on ·  with </tspan><tspan fill="#C1121F">RED</tspan></text><text x="40" y="110" font-size="34" font-weight="700" fill="#182831" text-anchor="start">Hand off through docs, not chats</text><text x="40" y="152" font-size="18" font-weight="400" fill="#60717D" text-anchor="start">Both models read from, and write back to, the same R, E and D</text><rect x="120" y="196" width="480" height="110" rx="14" fill="#EEF4F9" stroke="#1F6FA3" stroke-width="2"/><text x="360" y="244" font-size="28" font-weight="700" fill="#1F6FA3" text-anchor="middle">Premium model</text><text x="360" y="280" font-size="18" font-weight="400" fill="#30383c" text-anchor="middle">Kickoff · Major features · Code review</text><rect x="80" y="402" width="560" height="262" rx="16" fill="#FFFAF7" stroke="#E8DDD7" stroke-width="2"/><rect x="108.0" y="441.6" width="7.8" height="13.0" rx="2.1" fill="#C1121F" opacity="0.35"/><rect x="118.4" y="433.8" width="7.8" height="20.8" rx="2.1" fill="#C1121F" opacity="0.65"/><rect x="128.8" y="426.0" width="7.8" height="28.6" rx="2.1" fill="#C1121F" opacity="1"/><text x="152" y="448" font-size="22" font-weight="700" fill="#182831" text-anchor="start">Project documents</text><rect x="108" y="480" width="504" height="46" rx="8" fill="#FFFFFF" stroke="#E8DDD7"/><rect x="108" y="480" width="46" height="46" rx="8" fill="#C1121F" opacity="0.5"/><text x="131" y="511" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">R</text><text x="172" y="510" font-size="18" font-weight="400" fill="#30383c" text-anchor="start">Still under investigation: questions, evidence</text><rect x="108" y="538" width="504" height="46" rx="8" fill="#FFFFFF" stroke="#E8DDD7"/><rect x="108" y="538" width="46" height="46" rx="8" fill="#C1121F" opacity="0.75"/><text x="131" y="569" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">E</text><text x="172" y="568" font-size="18" font-weight="400" fill="#30383c" text-anchor="start">In progress: scope, acceptance, what&#x27;s out</text><rect x="108" y="596" width="504" height="46" rx="8" fill="#FFFFFF" stroke="#E8DDD7"/><rect x="108" y="596" width="46" height="46" rx="8" fill="#C1121F" opacity="1"/><text x="131" y="627" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text><text x="172" y="626" font-size="18" font-weight="400" fill="#30383c" text-anchor="start">Settled: goals, interfaces, rules</text><rect x="120" y="730" width="480" height="110" rx="14" fill="#FBEEF0" stroke="#AD2432" stroke-width="2"/><text x="360" y="778" font-size="28" font-weight="700" fill="#AD2432" text-anchor="middle">Budget model</text><text x="360" y="814" font-size="18" font-weight="400" fill="#30383c" text-anchor="middle">Daily development · Maintenance · Debugging</text><line x1="300" y1="306" x2="300" y2="392" stroke="#1F6FA3" stroke-width="3"/><path d="M292 390 L300 402 L308 390 Z" fill="#1F6FA3"/><line x1="420" y1="402" x2="420" y2="316" stroke="#1F6FA3" stroke-width="3"/><path d="M412 318 L420 306 L428 318 Z" fill="#1F6FA3"/><text x="292" y="360.0" font-size="17" font-weight="700" fill="#1F6FA3" text-anchor="end">read</text><text x="42