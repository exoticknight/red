<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title desc"><title id="title">On the same Plus plan, Luna sends about 70 times more messages</title><desc id="desc">Codex estimates of local messages per five hours on Plus: GPT-6 Astra 5 to 45, GPT-6 Luna 350 to 3,000.</desc><rect width="720" height="920" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><rect x="40.0" y="44.8" width="5.4" height="9.0" rx="1.4" fill="#C1121F" opacity="0.35"/><rect x="47.2" y="39.4" width="5.4" height="14.4" rx="1.4" fill="#C1121F" opacity="0.65"/><rect x="54.4" y="34.0" width="5.4" height="19.8" rx="1.4" fill="#C1121F" opacity="1"/><text x="76" y="52" font-size="18" font-weight="700" text-anchor="start"><tspan fill="#60717D">Frontier to start, budget to carry on ·  with </tspan><tspan fill="#C1121F">RED</tspan></text><text x="40" y="110" font-size="32" font-weight="700" fill="#182831" text-anchor="start">Same Plus plan</text><text x="40" y="168" font-size="48" font-weight="700" fill="#AD2432" text-anchor="start">Luna sends ~70× more</text><text x="40" y="210" font-size="18" font-weight="400" fill="#60717D" text-anchor="start">Codex estimate: local messages per five hours</text><rect x="105" y="652" width="190" height="8" rx="6" fill="#C9CED2"/><text x="200" y="602" font-size="44" font-weight="700" fill="#182831" text-anchor="middle">45</text><text x="200" y="634" font-size="16" font-weight="400" fill="#60717D" text-anchor="middle">range 5–45</text><text x="200" y="700" font-size="22" font-weight="700" fill="#26333D" text-anchor="middle">GPT-6 Astra</text><text x="200" y="728" font-size="16" font-weight="400" fill="#60717D" text-anchor="middle">frontier</text><rect x="425" y="360.0" width="190" height="300.0" rx="6" fill="#AD2432"/><text x="520" y="310.0" font-size="44" font-weight="700" fill="#AD2432" text-anchor="middle">3,000</text><text x="520" y="342.0" font-size="16" font-weight="400" fill="#60717D" text-anchor="middle">range 350–3,000</text><text x="520" y="700" font-size="22" font-weight="700" fill="#AD2432" text-anchor="middle">GPT-6 Luna</text><text x="520" y="728" font-size="16" font-weight="400" fill="#60717D" text-anchor="middle">budget</text><line x1="40" y1="660" x2="680" y2="660" stroke="#9AA3A9" stroke-width="2"/><text x="40" y="792" font-size="15" font-weight="400" fill="#788087" text-anchor="start">Source: learn.chatgpt.com/docs/pricing. Bars show the upper bound.</text><text x="40" y="816" font-size="15" font-weight="400" fill="#788087" text-anchor="start">OpenAI calls these estimates, not fixed limits; weekly limits may apply.</text><rect x="0" y="844" width="720" height="76" fill="#FFFAF7"/><line x1="0" y1="844" x2="720" y2="844" stroke="#E8DDD7" stroke-width="2"/><rect x="40.0" y="884.8" width="8.4" height="14.0" rx="2.2" fill="#C1121F" opacity="0.35"/><rect x="51.2" y="876.4" width="8.4" height="22.4" rx="2.2" fill="#C1121F" opacity="0.65"/><rect x="62.4" y="868.0" width="8.4" height="30.8" rx="2.2" fill="#C1121F" opacity="1"/><text x="84" y="891" font-size="24" font-weight="700" fill="#C1121F" text-anchor="start">RED</text><text x="140" y="890" font-size="15" font-weight="400" fill="#60717D" text-anchor="start">Research · Evolve · Document</text><text x="680" y="890" font-size="16" font-weight="700" fill="#30383c" text-anchor="end">github.com/exoticknight/red</text></g></svg>