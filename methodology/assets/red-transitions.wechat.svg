<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1260" viewBox="0 0 720 1260" role="img" aria-labelledby="title desc"><title id="title">三类文档，怎样推动工作</title><desc id="desc">R 的发现支持范围确认，E 在授权范围内实施并根据反馈调整，结果被接受后同步 D。D 为下一轮调查和改动提供依据；明确获准的改动可直接进入 E。</desc><rect width="720" height="1260" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><text x="40" y="46" font-size="16" font-weight="700" fill="#60717D">RED  /  RESEARCH · EVOLVE · DOCUMENT</text><text x="40" y="100" font-size="34" font-weight="700" fill="#182831">三类文档，怎样推动工作</text><text x="40" y="152" font-size="26" font-weight="400" fill="#26333D">人的目标与判断，贯穿每一轮协作</text><rect x="110" y="195" width="560" height="150" rx="16" fill="#EEF5F8" stroke="#276078" stroke-width="2"/><text x="134" y="243" font-size="30" font-weight="700" fill="#276078">R · 调查与判断依据</text><text x="134" y="287" font-size="24" font-weight="400" fill="#26333D">AI 调查问题，记录发现与建议</text><text x="134" y="323" font-size="24" font-weight="400" fill="#26333D">人据此判断方向和取舍</text><polyline points="380,345 380,445" fill="none" stroke="#60717D" stroke-width="3"/><polygon points="373,433 387,433 380,445" fill="#60717D"/><text x="408" y="386" font-size="22" font-weight="700" fill="#276078">确认推进范围</text><rect x="110" y="445" width="560" height="190" rx="16" fill="#FCF4EA" stroke="#9A5718" stroke-width="2"/><text x="134" y="493" font-size="30" font-weight="700" fill="#9A5718">E · 正在推进的改动</text><text x="134" y="537" font-size="24" font-weight="400" fill="#26333D">把确认的范围落实为方案和行动</text><text x="134" y="573" font-size="24" font-weight="400" fill="#26333D">根据结果与反馈，持续调整</text><text x="134" y="609" font-size="24" font-weight="400" fill="#26333D">记录进展、验证结果与待决事项</text><polyline points="670,490 694,490 694,597 670,597" fill="none" stroke="#60717D" stroke-width="3"/><polygon points="682,590 682,604 670,597" fill="#60717D"/><polyline points="380,635 380,735" fill="none" stroke="#60717D" stroke-width="3"/><polygon points="373,723 387,723 380,735" fill="#60717D"/><text x="408" y="672" font-size="22" font-weight="700" fill="#9A5718">结果经确认接受</text><text x="408" y="706" font-size="22" font-weight="700" fill="#9A5718">同步相关说明</text><rect x="110" y="735" width="560" height="190" rx="16" fill="#FBEEF0" stroke="#AD2432" stroke-width="2"/><text x="134" y="783" font-size="30" font-weight="700" fill="#AD2432">D · 后续可依循的共识</text><text x="134" y="827" font-size="24" font-weight="400" fill="#26333D">按使用、开发、维护等需要</text><text x="134" y="863" font-size="24" font-weight="400" fill="#26333D">整理已接受的规则与说明</text><text x="134" y="899" font-size="24" font-weight="400" fill="#26333D">为后续判断和实施提供依据</text><polyline points="110,860 66,860 66,267 110,267" fill="none" stroke="#60717D" stroke-width="3"/><polygon points="98,260 98,274 110,267" fill="#60717D"/><text x="110" y="985" font-size="26" font-weight="400" fill="#26333D">下一轮，先读已有 D</text><text x="110" y="1023" font-size="26" font-weight="400" fill="#26333D">有关键未知 → 回到 R 调查</text><text x="110" y="1061" font-size="26" font-weight="400" fill="#26333D">目标清楚且已获授权 → 进入 E</text><text x="40" y="1138" font-size="24" font-weight="400" fill="#26333D">推进中遇到影响方向的新问题，回到 R。</text><text x="40" y="1174" font-size="24" font-weight="400" fill="#26333D">反馈进入 E；接受的结果才更新 D。</text><text x="40" y="1210" font-size="24" font-weight="400" fill="#26333D">已有 D 也可能从项目开始就存在。</text></g></svg>
