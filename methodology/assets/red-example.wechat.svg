<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">02  从建议到现行规则</title><desc id="desc">谁在读取导出文件？ 哪些解析器依赖原格式？ 注明未覆盖的消费者 获准增加显式选项 保留默认导出行为 验证默认路径与新路径 默认：YYYY-MM-DD 显式选择：本地格式 记录区域来源与示例 研究结果 → 授权推进 → E 验证结果 → 接受结果 → D</desc><rect width="720" height="1080" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><text x="40" y="46" font-size="16" font-weight="700" fill="#60717D">RED  /  RESEARCH · EVOLVE · DOCUMENT</text><text x="40" y="100" font-size="34" font-weight="700" fill="#182831">02  从建议到现行规则</text><rect x="40" y="150" width="640" height="230" rx="16" fill="#EEF5F8" stroke="#276078" stroke-width="2"/><text x="64" y="198" font-size="30" font-weight="700" fill="#276078">R · 下游依赖调查</text><text x="64" y="242" font-size="30" font-weight="400" fill="#26333D">谁在读取导出文件？</text><text x="64" y="284" font-size="30" font-weight="400" fill="#26333D">哪些解析器依赖原格式？</text><text x="64" y="326" font-size="30" font-weight="400" fill="#26333D">注明未覆盖的消费者</text><rect x="40" y="410" width="640" height="230" rx="16" fill="#FCF4EA" stroke="#9A5718" stroke-width="2"/><text x="64" y="458" font-size="30" font-weight="700" fill="#9A5718">E · 可选格式改动</text><text x="64" y="502" font-size="30" font-weight="400" fill="#26333D">获准增加显式选项</text><text x="64" y="544" font-size="30" font-weight="400" fill="#26333D">保留默认导出行为</text><text x="64" y="586" font-size="30" font-weight="400" fill="#26333D">验证默认路径与新路径</text><rect x="40" y="670" width="640" height="230" rx="16" fill="#FBEEF0" stroke="#AD2432" stroke-width="2"/><text x="64" y="718" font-size="30" font-weight="700" fill="#AD2432">D · 已接受的规则</text><text x="64" y="762" font-size="30" font-weight="400" fill="#26333D">默认：YYYY-MM-DD</text><text x="64" y="804" font-size="30" font-weight="400" fill="#26333D">显式选择：本地格式</text><text x="64" y="846" font-size="30" font-weight="400" fill="#26333D">记录区域来源与示例</text><text x="40" y="970" font-size="28" font-weight="400" fill="#26333D">研究结果 → 授权推进 → E</text><text x="40" y="1010" font-size="28" font-weight="400" fill="#26333D">验证结果 → 接受结果 → D</text></g></svg>
