<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">01  Three knowledge states</title><desc id="desc">Address unknowns Questions and evidence Identify assumptions Develop changes Design, implement, verify Work within authorization Maintain agreements Goals, interfaces, rules A baseline for future work States describe how content is used. Evidence quality requires a separate judgment.</desc><rect width="1200" height="570" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><text x="40" y="46" font-size="16" font-weight="700" fill="#60717D">RED  /  RESEARCH · EVOLVE · DOCUMENT</text><text x="40" y="100" font-size="34" font-weight="700" fill="#182831">01  Three knowledge states</text><rect x="40" y="160" width="360" height="240" rx="16" fill="#EEF5F8" stroke="#276078" stroke-width="2"/><text x="64" y="208" font-size="30" font-weight="700" fill="#276078">R · Research</text><text x="64" y="252" font-size="23" font-weight="400" fill="#26333D">Address unknowns</text><text x="64" y="287" font-size="23" font-weight="400" fill="#26333D">Questions and evidence</text><text x="64" y="322" font-size="23" font-weight="400" fill="#26333D">Identify assumptions</text><rect x="420" y="160" width="360" height="240" rx="16" fill="#FCF4EA" stroke="#9A5718" stroke-width="2"/><text x="444" y="208" font-size="30" font-weight="700" fill="#9A5718">E · Evolve</text><text x="444" y="252" font-size="23" font-weight="400" fill="#26333D">Develop changes</text><text x="444" y="287" font-size="23" font-weight="400" fill="#26333D">Design, implement, verify</text><text x="444" y="322" font-size="23" font-weight="400" fill="#26333D">Work within authorization</text><rect x="800" y="160" width="360" height="240" rx="16" fill="#FBEEF0" stroke="#AD2432" stroke-width="2"/><text x="824" y="208" font-size="30" font-weight="700" fill="#AD2432">D · Document</text><text x="824" y="252" font-size="23" font-weight="400" fil