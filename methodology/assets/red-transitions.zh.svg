<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-labelledby="title desc"><title id="title">02  从当前基线到新的共识</title><desc id="desc">当前 D + 实现证据. 读取相关规则，检查代码、测试与运行结果 R · 存在关键未知. 调查可能改变决定的问题 提交发现、风险与建议范围 明确且已获授权的改动. 目标与边界清楚 可以直接进入 E 确认点 1 · 授权推进. 人或项目授权的决策来源确认范围 E · 设计、实现、验证与修改. 在获准范围内持续工作 提交验证证据与拟更新的 D 内容 确认点 2 · 接受具体结果. 人或项目授权的决策来源审查并接受 同步 D · 形成新的基线. 只同步被接受的范围，并核对实现 回流：D 与实现证据冲突时，返回 R 调查。 拒绝：D 不变。部分接受：仅同步被接受的范围。</desc><rect width="1200" height="1350" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><text x="40" y="46" font-size="16" font-weight="700" fill="#60717D">RED  /  RESEARCH · EVOLVE · DOCUMENT</text><text x="40" y="100" font-size="34" font-weight="700" fill="#182831">02  从当前基线到新的共识</text><rect x="128" y="145" width="1032" height="125" rx="16" fill="#FBEEF0" stroke="#AD2432" stroke-width="2"/><text x="152" y="193" font-size="30" font-weight="700" fill="#AD2432">当前 D + 实现证据</text><text x="152" y="237" font-size="24" font-weight="400" fill="#26333D">读取相关规则，检查代码、测试与运行结果</text><polyline points="380,270 380,325" fill="none" stroke="#60717D" stroke-width="3"/><polygon points="373,313 387,313 380,325" fill="#60717D"/><polyline points="900,270 900,325" fill="none" stroke="#60717D" stroke-width="3"/><polygon points="893,313 907,313 900,325" fill="#60717D"/><rect x="128" y="325" width="560" height="160" rx="16" fill="#EEF5F8" stroke="#276078" stroke-width="2"/><text x="152" y="373" font-size="30" font-weight="700" fill="#276078">R · 存在关键未知</text><text x="152" y="417" font-size="22" font-weight="400" fill="#26333D">调查可能改变决定的问题</text><text x="152" y="451" font-size="22" font-weight="400" fill="#26333D">提交发现、风险与建议范围</text><rect x="740" y="325" width="420" height="160" rx="16" fill="#FCF4EA" stroke="#9A5718" stroke-width="2"/><text x="764" y="373" font-size="30" font-weight="700" fill="#9A5718">明确且已获授权的改动</text><text x="764" y="417" font-size="22" font-weight="400" fill="#26333D">目标与边界清楚</text><text x="764" y="451" font-size="22" font-weight="400" fill="#26333D">可以直接进入 E</text><polyline points="400,485 400,530" fill="none" stroke="#60717D" stroke-width="3"/><polygon points="393,518 407,518 400,530" fill="#60717D"/><rect x="128" y="530" width="680" height="125" rx="16" fill="#EEF5F8" stroke="#276078" stroke-width="2"/><text x="152" y="578" font-size="30" font-weight="700" fill="#276078">确认点 1 · 授权推进</text><text x="152" y="622" font-size="23" font-weight="400" fill="#26333D">人或项目授权的决策来源确认范围</text><polyline points="400,655 400,705" fill="none" stroke="#60717D" stroke-width="3"/><polygon points="393,693 407,693 400,705" fill="#60717D"/><polyline points="960,485 960,705" fill="none" stroke="#60717D" stroke-width="3"/><polygon points="953,693 967,693 960,705" fill="#60717D"/><rect x="128" y="705" width="1032" height="160" rx="16" fill="#FCF4EA" stroke="#9A5718" stroke-width="2"/><text x="152" y="753" font-size="30" font-weight="700" fill="#9A5718">E · 设计、实现、验证与修改</text><text x="152" y="797" font-size="24" font-weight="400" fill="#26333D">在获准范围内持续工作</text><text x="152" y="833" font-size="24" font-weight="400" fill="#26333D">提交验证证据与拟更新的 D 内容</text><polyline points="650,865 650,915" fill="none" stroke="#60717D" stroke-width="3"/><polygon points="643,903 657,903 650,915" fill="#60717D"/><rect x="128" y="915" width="1032" height="125" rx="16" fill="#FCF4EA" stroke="#9A5718" stroke-width="2"/><text x="152" y="963" font-size="30" font-weight="700" fill="#9A5718">确认点 2 · 接受具体结果</text><text x="152" y="1007" font-size="24" font-weight="400" fill="#26333D">人或项目授权的决策来源审查并接受</text><polyline points="650,1040 650,1090" fill="none" stroke="#60717D" stroke-width="3"/><polygon points="643,1078 657,1078 650,1090" fill="#60717D"/><rect x="128" y="1090" width="1032" height="125" rx="16" fill="#FBEEF0" stroke="#AD2432" stroke-width="2"/><text x="152" y="1138" font-size="30" font-weight="700" fill="#AD2432">同步 D · 形成新的基线</text><text x="152" y="1182" font-size="24" font-weight="400" fill="#26333D">只同步被接受的范围，