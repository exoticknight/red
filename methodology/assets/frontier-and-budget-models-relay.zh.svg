<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc"><title id="title">交接靠文档，不靠会话</title><desc id="desc">贵模型负责决定、编排和审查，便宜模型负责执行；两者都从项目里的 R、E、D 读起，也写回这里，彼此不直接交接。</desc><rect width="720" height="1040" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><rect x="40.0" y="44.8" width="5.4" height="9.0" rx="1.4" fill="#C1121F" opacity="0.35"/><rect x="47.2" y="39.4" width="5.4" height="14.4" rx="1.4" fill="#C1121F" opacity="0.65"/><rect x="54.4" y="34.0" width="5.4" height="19.8" rx="1.4" fill="#C1121F" opacity="1"/><text x="76" y="52" font-size="18" font-weight="700" text-anchor="start"><tspan fill="#60717D">高模开局，低模接手  with </tspan><tspan fill="#C1121F">RED</tspan></text><text x="40" y="110" font-size="34" font-weight="700" fill="#182831" text-anchor="start">交接靠文档，不靠会话</text><text x="40" y="152" font-size="18" font-weight="400" fill="#60717D" text-anchor="start">贵模型、便宜模型都从同一份 R、E、D 读起，也写回这里</text><rect x="120" y="196" width="480" height="110" rx="14" fill="#EEF4F9" stroke="#1F6FA3" stroke-width="2"/><text x="360" y="244" font-size="28" font-weight="700" fill="#1F6FA3" text-anchor="middle">贵模型</text><text x="360" y="280" font-size="18" font-weight="400" fill="#30383c" text-anchor="middle">开局讨论 · 重大功能 · 代码审查</text><rect x="80" y="402" width="560" height="262" rx="16" fill="#FFFAF7" stroke="#E8DDD7" stroke-width="2"/><rect x="108.0" y="441.6" width="7.8" height="13.0" rx="2.1" fill="#C1121F" opacity="0.35"/><rect x="118.4" y="433.8" width="7.8" height="20.8" rx="2.1" fill="#C1121F" opacity="0.65"/><rect x="128.8" y="426.0" width="7.8" height="28.6" rx="2.1" fill="#C1121F" opacity="1"/><text x="152" y="448" font-size="22" font-weight="700" fill="#182831" text-anchor="start">项目里的文档</text><rect x="108" y="480" width="504" height="46" rx="8" fill="#FFFFFF" stroke="#E8DDD7"/><rect x="108" y="480" width="46" height="46" rx="8" fill="#C1121F" opacity="0.5"/><text x="131" y="511" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">R</text><text x="172" y="510" font-size="18" font-weight="400" fill="#30383c" text-anchor="start">还在调查的：问题和证据</text><rect x="108" y="538" width="504" height="46" rx="8" fill="#FFFFFF" stroke="#E8DDD7"/><rect x="108" y="538" width="46" height="46" rx="8" fill="#C1121F" opacity="0.75"/><text x="131" y="569" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">E</text><text x="172" y="568" font-size="18" font-weight="400" fill="#30383c" text-anchor="start">正在推进的：范围、验收、不做的事</text><rect x="108" y="596" width="504" height="46" rx="8" fill="#FFFFFF" stroke="#E8DDD7"/><rect x="108" y="596" width="46" height="46" rx="8" fill="#C1121F" opacity="1"/><text x="131" y="627" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text><text x="172" y="626" font-size="18" font-weight="400" fill="#30383c" text-anchor="start">已经定下来的：目标、接口、规则</text><rect x="120" y="730" width="480" height="110" rx="14" fill="#FBEEF0" stroke="#AD2432" stroke-width="2"/><text x="360" y="778" font-size="28" font-weight="700" fill="#AD2432" text-anchor="middle">便宜模型</text><text x="360" y="814" font-size="18" font-weight="400" fill="#30383c" text-anchor="middle">日常开发 · 维护 · 查问题</text><line x1="300" y1="306" x2="300" y2="392" stroke="#1F6FA3" stroke-width="3"/><path d="M292 390 L300 402 L308 390 Z" fill="#1F6FA3"/><line x1="420" y1="402" x2="420" y2="316" stroke="#1F6FA3" stroke-width="3"/><path d="M412 318 L420 306 L428 318 Z" fill="#1F6FA3"/><text x="292" y="360.0" font-size="17" font-weight="700" fill="#1F6FA3" text-anchor="end">读</text><text x="428" y="360.0" font-size="17" font-weight="700" fill="#1F6FA3" text-anchor="start">写回</text><line x1="300" y1="664" x2="300" y2="720" stroke="#AD2432" stroke-width="3"/><path d="M292 718 L300 730 L308 718 Z" fill="#AD2432"/><line x1="420" y1="730" x2="420" y2="674" stroke="#AD2432" stroke-width="3"/><path d="M412 676 L420 664 L428 676 Z" fill="#AD2432"/><text x="292" y="703.0" font-size="17" font-weight="700" fill="#AD2432" text-anchor="end">读</text><text x="428" y="703.0" font-size="17" font-weight="700" fill="#AD2432" text-anchor="start">写回</text><path d="M620 251 C 700 251, 700 785, 620 785" fill="none" stroke="#9AA3A9" stroke-width="2" stroke-dasharray="7 6"/><circle cx="680" cy="518" r="15" fill="#FFFFFF" stroke="#9AA3A9" stroke-width="2"/><path d="M670 508 L690 528 M690 508 L670 528" stroke="#AD2432" stroke-width="3"/><rect x="652" y="542" width="56" height="66" fill="#FFFFFF"/><text x="680" y="560" font-size="15" font-weight="400" fill="#60717D" text-anchor="middle">不靠</text><text x="680" y="580" font-size="15" font-weight="400" fill="#60717D" text-anchor="middle">会话</text><text x="680" y="600" font-size="15" font-weight="400" fill="#60717D" text-anchor="middle">交接</text><text x="40" y="936" font-size="15" font-weight="400" fill="#788087" text-anchor="start">换模型、换会话、换工具，都从这份文档接着干。</text><rect x="0" y="964" width="720" height="76" fill="#FFFAF7"/><line x1="0" y1="964" x2="720" y2="964" stroke="#E8DDD7" stroke-width="2"/><rect x="40.0" y="1004.8" width="8.4" height="14.0" rx="2.2" fill="#C1121F" opacity="0.35"/><rect x="51.2" y="996.4" width="8.4" height="22.4" rx="2.2" fill="#C1121F" opacity="0.65"/><rect x="62.4" y="988.0" width="8.4" height="30.8" rx="2.2" fill="#C1121F" opacity="1"/><text x="84" y="1011" font-size="24" font-weight="700" fill="#C1121F" text-anchor="start">RED</text><text x="140" y="1010" font-size="15" font-weight="400" fill="#60717D" text-anchor="start">Research · Evolve · Document</text><text x="680" y="1010" font-size="16" font-weight="700" fill="#30383c" text-anchor="end">github.com/exoticknight/red</text></g></svg>