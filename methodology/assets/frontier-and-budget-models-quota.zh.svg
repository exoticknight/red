<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title desc"><title id="title">同样一个 Plus 套餐，Luna 能多发约 70 倍消息</title><desc id="desc">Codex 官方估算，Plus 套餐每五小时本地消息数：GPT-6 Astra 5 到 45 条，GPT-6 Luna 350 到 3000 条。</desc><rect width="720" height="920" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><rect x="40.0" y="44.8" width="5.4" height="9.0" rx="1.4" fill="#C1121F" opacity="0.35"/><rect x="47.2" y="39.4" width="5.4" height="14.4" rx="1.4" fill="#C1121F" opacity="0.65"/><rect x="54.4" y="34.0" width="5.4" height="19.8" rx="1.4" fill="#C1121F" opacity="1"/><text x="76" y="52" font-size="18" font-weight="700" text-anchor="start"><tspan fill="#60717D">高模开局，低模接手  with </tspan><tspan fill="#C1121F">RED</tspan></text><text x="40" y="110" font-size="32" font-weight="700" fill="#182831" text-anchor="start">同样一个 Plus 套餐</text><text x="40" y="168" font-size="48" font-weight="700" fill="#AD2432" text-anchor="start">Luna 能多发约 70 倍</text><text x="40" y="210" font-size="18" font-weight="400" fill="#60717D" text-anchor="start">Codex 官方估算：每五小时能发的本地消息数</text><rect x="105" y="652" width="190" height="8" rx="6" fill="#C9CED2"/><text x="200" y="602" font-size="44" font-weight="700" fill="#182831" text-anchor="middle">45 条</text><text x="200" y="634" font-size="16" font-weight="400" fill="#60717D" text-anchor="middle">区间 5–45</text><text x="200" y="700" font-size="22" font-weight="700" fill="#26333D" text-anchor="middle">GPT-6 Astra</text><text x="200" y="728" font-size="16" font-weight="400" fill="#60717D" text-anchor="middle">顶级</text><rect x="425" y="360.0" width="190" height="300.0" rx="6" fill="#AD2432"/><text x="520" y="310.0" font-size="44" font-weight="700" fill="#AD2432" text-anchor="middle">3,000 条</text><text x="520" y="342.0" font-size="16" font-weight="400" fill="#60717D" text-anchor="middle">区间 350–3,000</text><text x="520" y="700" font-size="22" font-weight="700" fill="#AD2432" text-anchor="middle">GPT-6 Luna</text><text x="520" y="728" font-size="16" font-weight="400" fill="#60717D" text-anchor="middle">便宜</text><line x1="40" y1="660" x2="680" y2="660" stroke="#9AA3A9" stroke-width="2"/><text x="40" y="792" font-size="15" font-weight="400" fill="#788087" text-anchor="start">来源：OpenAI Codex 定价页（learn.chatgpt.com/docs/pricing）。柱高取区间上限；</text><text x="40" y="816" font-size="15" font-weight="400" fill="#788087" text-anchor="start">官方说明这是估算，不是固定上限，另可能有每周限额。</text><rect x="0" y="844" width="720" height="76" fill="#FFFAF7"/><line x1="0" y1="844" x2="720" y2="844" stroke="#E8DDD7" stroke-width="2"/><rect x="40.0" y="884.8" width="8.4" height="14.0" rx="2.2" fill="#C1121F" opacity="0.35"/><rect x="51.2" y="876.4" width="8.4" height="22.4" rx="2.2" fill="#C1121F" opacity="0.65"/><rect x="62.4" y="868.0" width="8.4" height="30.8" rx="2.2" fill="#C1121F" opacity="1"/><text x="84" y="891" font-size="24" font-weight="700" fill="#C1121F" text-anchor="start">RED</text><text x="140" y="890" font-size="15" font-weight="400" fill="#60717D" text-anchor="start">Research · Evolve · Document</text><text x="680" y="890" font-size="16" font-weight="700" fill="#30383c" text-anchor="end">github.com/exoticknight/red</text></g></svg>