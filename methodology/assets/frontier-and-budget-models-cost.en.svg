<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1090" viewBox="0 0 720 1090" role="img" aria-labelledby="title desc"><title id="title">Mixing models costs 81% less than running everything on a frontier model</title><desc id="desc">About 1.94 billion tokens over a month, priced at average API rates. Daily work on GPT-6 Astra as well would total about $2,580, on Claude Opus 5 about $1,474, on GPT-5.6 Sol about $1,371; the actual mix cost about $485, saving 81%, 67% and 65%.</desc><rect width="720" height="1090" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><rect x="40.0" y="44.8" width="5.4" height="9.0" rx="1.4" fill="#C1121F" opacity="0.35"/><rect x="47.2" y="39.4" width="5.4" height="14.4" rx="1.4" fill="#C1121F" opacity="0.65"/><rect x="54.4" y="34.0" width="5.4" height="19.8" rx="1.4" fill="#C1121F" opacity="1"/><text x="76" y="52" font-size="18" font-weight="700" text-anchor="start"><tspan fill="#60717D">Frontier to start, budget to carry on ·  with </tspan><tspan fill="#C1121F">RED</tspan></text><text x="40" y="104" font-size="30" font-weight="700" fill="#182831" text-anchor="start">Don&#x27;t run everything on frontier models</text><text x="40" y="162" font-size="44" font-weight="700" fill="#AD2432" text-anchor="start">Mix them: 81% cheaper</text><text x="40" y="204" font-size="18" font-weight="400" fill="#60717D" text-anchor="start">About 1.94B tokens over a month, at average API prices</text><rect x="40" y="236" width="18" height="18" rx="3" fill="#1F6FA3"/><text x="68" y="250" font-size="16" font-weight="400" fill="#30383c" text-anchor="start">Premium models, actual: $451 (kickoff, major features, review; same in all four)</text><rect x="40" y="266" width="18" height="18" rx="3" fill="#C9CED2"/><text x="68" y="280" font-size="16" font-weight="400" fill="#30383c" text-anchor="start">Daily 1.43B tokens on the same model too (estimate)</text><rect x="40" y="296" width="18" height="18" rx="3" fill="#AD2432"/><text x="68" y="310" font-size="16" font-weight="400" fill="#30383c" text-anchor="start">Daily work on budget models (actual)</text><rect x="65" y="730.1" width="110" height="69.9" fill="#1F6FA3" stroke="#FFFFFF" stroke-width="2"/><rect x="65" y="400.1" width="110" height="330.1" fill="#C9CED2" stroke="#FFFFFF" stroke-width="2"/><text x="120" y="386.07131782945737" font-size="28" font-weight="700" fill="#182831" text-anchor="middle">$2,580</text><text x="120" y="836" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">GPT-6 Astra</text><text x="120" y="862" font-size="15" font-weight="400" fill="#60717D" text-anchor="middle">daily work too</text><text x="120" y="892" font-size="17" font-weight="700" fill="#AD2432" text-anchor="middle">saves 81%</text><rect x="225" y="730.1" width="110" height="69.9" fill="#1F6FA3" stroke="#FFFFFF" stroke-width="2"/><rect x="225" y="571.5" width="110" height="158.6" fill="#C9CED2" stroke="#FFFFFF" stroke-width="2"/><text x="280" y="557.5441860465116" font-size="28" font-weight="700" fill="#182831" text-anchor="middle">$1,474</text><text x="280" y="836" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">Claude Opus 5</text><text x="280" y="862" font-size="15" font-weight="400" fill="#60717D" text-anchor="middle">daily work too</text><text x="280" y="892" font-size="17" font-weight="700" fill="#AD2432" text-anchor="middle">saves 67%</text><rect x="385" y="730.1" width="110" height="69.9" fill="#1F6FA3" stroke="#FFFFFF" stroke-width="2"/><rect x="385" y="587.4" width="110" height="142.8" fill="#C9CED2" stroke="#FFFFFF" stroke-width="2"/><text x="440" y="573.3581395348838" font-size="28" font-weight="700" fill="#182831" text-anchor="middle">$1,371</text><text x="440" y="836" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">GPT-5.6 Sol</text><text x="440" y="862" font-size="15" font-weight="400" fill="#60717D" text-anchor="middle">daily work too</text><text x="440" y="892" font-size="17" font-weight="700" fill="#AD2432" text-anchor="middle">saves 65%</text><rect x="545" y="730.1" width="110" height="69.9" fill="#1F6FA3" stroke="#FFFFFF" stroke-width="2"/><rect x="545" y="724.1" width="110" height="6.0" fill="#AD2432" stroke="#FFFFFF" stroke-width="2"/><text x="600" y="710.1488372093023" font-size="28" font-weight="700" fill="#AD2432" text-anchor="middle">$485</text><text x="600" y="836" font-size="18" font-weight="700" fill="#AD2432" text-anchor="middle">Mixed</text><text x="600" y="862" font-size="15" font-weight="400" fill="#60717D" text-anchor="middle">actual</text><line x1="40" y1="800" x2="680" y2="800" stroke="#9AA3A9" stroke-width="2"/><text x="40" y="962" font-size="15" font-weight="400" fill="#788087" text-anchor="start">Data: author&#x27;s usage, mostly from 7 DSH-related projects. Plans are subscriptions;</text><text x="40" y="986" font-size="15" font-weight="400" fill="#788087" text-anchor="start">costs are API-equivalent estimates at each model&#x27;s average price (cache included).</text><rect x="0" y="1014" width="720" height="76" fill="#FFFAF7"/><line x1="0" y1="1014" x2="720" y2="1014" stroke="#E8DDD7" stroke-width="2"/><rect x="40.0" y="1054.8" width="8.4" height="14.0" rx="2.2" fill="#C1121F" opacity="0.35"/><rect x="51.2" y="1046.4" width="8.4" height="22.4" rx="2.2" fill="#C1121F" opacity="0.65"/><rect x="62.4" y="1038.0" width="8.4" height="30.8" rx="2.2" fill="#C1121F" opacity="1"/><text x="84" y="1061" font-size="24" font-weight="700" fill="#C1121F" text-anchor="start">RED</text><text x="140" y="1060" font-size="15" font-weight="400" fill="#60717D" text-anchor="start">Research · Evolve · Document</text><text x="680" y="1060" font-size="16" font-weight="700" fill="#30383c" text-anchor="end">github.com/exoticknight/red</text></g></svg>