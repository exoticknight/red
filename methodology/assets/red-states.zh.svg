<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">01  三种知识状态</title><desc id="desc">处理未知 问题、证据与假设 说明已知与调查边界 推进变化 方案、实现与验证 在获准范围内持续工作 维护共识 目标、接口与规则 形成后续工作的基线 状态说明协作用途。 证据可信度需要单独判断。</desc><rect width="1200" height="570" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><text x="40" y="46" font-size="16" font-weight="700" fill="#60717D">RED  /  RESEARCH · EVOLVE · DOCUMENT</text><text x="40" y="100" font-size="34" font-weight="700" fill="#182831">01  三种知识状态</text><rect x="40" y="160" width="360" height="240" rx="16" fill="#EEF5F8" stroke="#276078" stroke-width="2"/><text x="64" y="208" font-size="30" font-weight="700" fill="#276078">R · Research</text><text x="64" y="252" font-size="23" font-weight="400" fill="#26333D">处理未知</text><text x="64" y="287" font-size="23" font-weight="400" fill="#26333D">问题、证据与假设</text><text x="64" y="322" font-size="23" font-weight="400" fill="#26333D">说明已知与调查边界</text><rect x="420" y="160" width="360" height="240" rx="16" fill="#FCF4EA" stroke="#9A5718" stroke-width="2"/><text x="444" y="208" font-size="30" font-weight="700" fill="#9A5718">E · Evolve</text><text x="444" y="252" font-size="23" font-weight="400" fill="#26333D">推进变化</text><text x="444" y="287" font-size="23" font-weight="400" fill="#26333D">方案、实现与验证</text><text x="444" y="322" font-size="23" font-weight="400" fill="#26333D">在获准范围内持续工作</text><rect x="800" y="160" width="360" height="240" rx="16" fill="#FBEEF0" stroke="#AD2432" stroke-width="2"/><text x="824" y="208" font-size="30" font-weight="700" fill="#AD2432">D · Document</text><text x="824" y="252" font-size="23" font-weight="400" fill="#26333D">维护共识</text><text x="824" y="287" font-size="23" font-weight="400" fill="#26333D">目标、接口与规则</text><text x="824" y="322" font-size="23" font-weight="400" fill="#26333D">形成后续工作的基线</text><text x="40" y="464" font-size="24" font-weight="400" fill="#26333D">状态说明协作用途。</text><text x="40" y="500" f