<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1090" viewBox="0 0 720 1090" role="img" aria-labelledby="title desc"><title id="title">不一味用贵模型，换成搭配着用，比全用顶级模型省下 81%</title><desc id="desc">同一个多月约 19 亿 token 的开发，按 API 均价估算。日常也用 GPT-6 Astra 约 2580 美元，也用 Claude Opus 5 约 1474，也用 GPT-5.6 Sol 约 1371；高低模搭配实际约 485 美元，分别省下 81%、67%、65%。</desc><rect width="720" height="1090" fill="#FFFFFF"/><g font-family="Microsoft YaHei"><rect x="40.0" y="44.8" width="5.4" height="9.0" rx="1.4" fill="#C1121F" opacity="0.35"/><rect x="47.2" y="39.4" width="5.4" height="14.4" rx="1.4" fill="#C1121F" opacity="0.65"/><rect x="54.4" y="34.0" width="5.4" height="19.8" rx="1.4" fill="#C1121F" opacity="1"/><text x="76" y="52" font-size="18" font-weight="700" text-anchor="start"><tspan fill="#60717D">高模开局，低模接手  with </tspan><tspan fill="#C1121F">RED</tspan></text><text x="40" y="104" font-size="30" font-weight="700" fill="#182831" text-anchor="start">不一味用贵模型，换成搭配着用</text><text x="40" y="162" font-size="44" font-weight="700" fill="#AD2432" text-anchor="start">比全用顶级模型，省下 81%</text><text x="40" y="204" font-size="18" font-weight="400" fill="#60717D" text-anchor="start">同一个多月、约 19 亿 token 的开发，按 API 均价估算</text><rect x="40" y="236" width="18" height="18" rx="3" fill="#1F6FA3"/><text x="68" y="250" font-size="16" font-weight="400" fill="#30383c" text-anchor="start">高价模型实际用量 $451（开局、重大功能、审查，四根相同）</text><rect x="40" y="266" width="18" height="18" rx="3" fill="#C9CED2"/><text x="68" y="280" font-size="16" font-weight="400" fill="#30383c" text-anchor="start">日常 14.3 亿 token 也用贵模型（估算）</text><rect x="40" y="296" width="18" height="18" rx="3" fill="#AD2432"/><text x="68" y="310" font-size="16" font-weight="400" fill="#30383c" text-anchor="start">日常换成便宜模型（实际）</text><rect x="65" y="730.1" width="110" height="69.9" fill="#1F6FA3" stroke="#FFFFFF" stroke-width="2"/><rect x="65" y="400.1" width="110" height="330.1" fill="#C9CED2" stroke="#FFFFFF" stroke-width="2"/><text x="120" y="386.07131782945737" font-size="28" font-weight="700" fill="#182831" text-anchor="middle">$2,580</text><text x="120" y="836" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">GPT-6 Astra</text><text x="120" y="862" font-size="15" font-weight="400" fill="#60717D" text-anchor="middle">日常也用它</text><text x="120" y="892" font-size="17" font-weight="700" fill="#AD2432" text-anchor="middle">换成搭配 省 81%</text><rect x="225" y="730.1" width="110" height="69.9" fill="#1F6FA3" stroke="#FFFFFF" stroke-width="2"/><rect x="225" y="571.5" width="110" height="158.6" fill="#C9CED2" stroke="#FFFFFF" stroke-width="2"/><text x="280" y="557.5441860465116" font-size="28" font-weight="700" fill="#182831" text-anchor="middle">$1,474</text><text x="280" y="836" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">Claude Opus 5</text><text x="280" y="862" font-size="15" font-weight="400" fill="#60717D" text-anchor="middle">日常也用它</text><text x="280" y="892" font-size="17" font-weight="700" fill="#AD2432" text-anchor="middle">换成搭配 省 67%</text><rect x="385" y="730.1" width="110" height="69.9" fill="#1F6FA3" stroke="#FFFFFF" stroke-width="2"/><rect x="385" y="587.4" width="110" height="142.8" fill="#C9CED2" stroke="#FFFFFF" stroke-width="2"/><text x="440" y="573.3581395348838" font-size="28" font-weight="700" fill="#182831" text-anchor="middle">$1,371</text><text x="440" y="836" font-size="18" font-weight="700" fill="#26333D" text-anchor="middle">GPT-5.6 Sol</text><text x="440" y="862" font-size="15" font-weight="400" fill="#60717D" text-anchor="middle">日常也用它</text><text x="440" y="892" font-size="17" font-weight="700" fill="#AD2432" text-anchor="middle">换成搭配 省 65%</text><rect x="545" y="730.1" width="110" height="69.9" fill="#1F6FA3" stroke="#FFFFFF" stroke-width="2"/><rect x="545" y="724.1" width="110" height="6.0" fill="#AD2432" stroke="#FFFFFF" stroke-width="2"/><text x="600" y="710.1488372093023" font-size="28" font-weight="700" fill="#AD2432" text-anchor="middle">$485</text><text x="600" y="836" font-size="18" font-weight="700" fill="#AD2432" text-anchor="middle">搭配使用</text><text x="600" y="862" font-size="15" font-weight="400" fill="#60717D" text-anchor="middle">实际</text><line x1="40" y1="800" x2="680" y2="800" stroke="#9AA3A9" stroke-width="2"/><text x="40" y="962" font-size="15" font-weight="400" fill="#788087" text-anchor="start">数据：作者用量统计，主要来自 7 个 DSH 相关项目。实际为订阅制，费用为 API 等价估算；</text><text x="40" y="986" font-size="15" font-weight="400" fill="#788087" text-anchor="start">换算按各模型同期实际均价（含缓存），只看量级。</text><rect x="0" y="1014" width="720" height="76" fill="#FFFAF7"/><line x1="0" y1="1014" x2="720" y2="1014" stroke="#E8DDD7" stroke-width="2"/><rect x="40.0" y="1054.8" width="8.4" height="14.0" rx="2.2" fill="#C1121F" opacity="0.35"/><rect x="51.2" y="1046.4" width="8.4" height="22.4" rx="2.2" fill="#C1121F" opacity="0.65"/><rect x="62.4" y="1038.0" width="8.4" height="30.8" rx="2.2" fill="#C1121F" opacity="1"/><text x="84" y="1061" font-size="24" font-weight="700" fill="#C1121F" text-anchor="start">RED</text><text x="140" y="1060" font-size="15" font-weight="400" fill="#60717D" text-anchor="start">Research · Evolve · Document</text><text x="680" y="1060" font-size="16" font-weight="700" fill="#30383c" text-anchor="end">github.com/exoticknight/red</text></g></svg>