name: Article site

on:
  pull_request:
    paths: ["website/**", "methodology/**", ".github/workflows/pages.yml"]
  push:
    branches: [main]
    paths: ["website/**", "methodology/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          SITE_URL: ${{ vars.RED_SITE_URL || 'https://exoticknight.github.io/red/' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
