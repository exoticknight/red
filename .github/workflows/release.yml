name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/node/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
        working-directory: cli/node
      - run: python -m pip install -r requirements-dev.txt
      - name: Prepare coordinated version
        run: python scripts/set_release_version.py "${GITHUB_REF_NAME}"
      - run: python scripts/sync_distribution.py
      - run: node cli/node/src/cli.js check --json
      - run: npm test
        working-directory: cli/node
      - run: python -m unittest discover -s tests -v
        working-directory: cli/python
      - run: python cli/conformance/run.py
      - run: python scripts/validate_repository.py
      - name: Build npm package
        run: |
          mkdir -p ../../dist/npm
          npm pack --pack-destination ../../dist/npm
        working-directory: cli/node
      - name: Build Python package
        run: python -m build cli/python --outdir dist/python
      - name: Build plugin and Skill archives
        run: python scripts/build_release_assets.py "${GITHUB_REF_NAME#v}"
      - name: Verify release archives
        run: python scripts/verify_release_assets.py "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist
          if-no-files-found: error

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish "dist/npm/red-methodology-cli-${GITHUB_REF_NAME#v}.tgz" --access public --provenance

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python

  github-release:
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes dist/npm/* dist/python/* dist/bundles/*
