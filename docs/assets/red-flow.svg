<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Three states. A shared understanding.</title>
  <desc id="desc">Research holds questions and evidence. Authorization turns findings into Evolve work. Verification and acceptance allow updating Document. Clear authorized work may enter Evolve directly. Document provides the baseline for subsequent research and changes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#8e7d74" stroke-width="1.5"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#c1121f" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="578" rx="24" fill="#fffaf7" stroke="#e8ddd7"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="36" y="40" font-size="12" font-weight="700" letter-spacing="2" fill="#a1252b">THE RED MODEL</text>
    <text x="36" y="78" font-size="28" font-weight="700" fill="#2b2421">Three states. A shared understanding.</text>
    <text x="36" y="109" font-size="16" fill="#6e5e55">Give each question, change, and decision a place.</text>
    <rect x="336" y="140" width="288" height="40" rx="20" fill="#f8e5e3"/>
    <text x="480" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#9f1722">Clear, authorized work</text>
    <path d="M480 182v31" fill="none" stroke="#c1121f" stroke-width="2" marker-end="url(#red-arrow)"/>
    <rect x="36" y="222" width="252" height="190" rx="16" fill="#ffffff" stroke="#dccfc7"/>
    <rect x="354" y="222" width="252" height="190" rx="16" fill="#ffffff" stroke="#d78788"/>
    <rect x="672" y="222" width="252" height="190" rx="16" fill="#ffffff" stroke="#dccfc7"/>
    <rect x="56" y="242" width="36" height="36" rx="10" fill="#f1e8e1"/>
    <text x="74" y="267" text-anchor="middle" font-size="23" font-weight="700" fill="#675043">R</text>
    <text x="103" y="267" font-size="24" font-weight="700" fill="#2b2421">Research</text>
    <text x="56" y="309" font-size="17" font-weight="600" fill="#675043">What do we need to learn?</text>
    <text x="56" y="342" font-size="16" fill="#6e5e55">Questions and evidence</text>
    <text x="56" y="369" font-size="16" fill="#6e5e55">Hypotheses and conflicts</text>
    <rect x="374" y="242" width="36" height="36" rx="10" fill="#c1121f"/>
    <text x="392" y="267" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">E</text>
    <text x="421" y="267" font-size="24" font-weight="700" fill="#2b2421">Evolve</text>
    <text x="374" y="309" font-size="17" font-weight="600" fill="#a1252b">What are we changing?</text>
    <text x="374" y="342" font-size="16" fill="#6e5e55">Scope and rationale</text>
    <text x="374" y="369" font-size="16" fill="#6e5e55">Implementation and checks</text>
    <rect x="692" y="242" width="36" height="36" rx="10" fill="#e6ece7"/>
    <text x="710" y="267" text-anchor="middle" font-size="23" font-weight="700" fill="#425a48">D</text>
    <text x="739" y="267" font-size="24" font-weight="700" fill="#2b2421">Document</text>
    <text x="692" y="309" font-size="17" font-weight="600" fill="#425a48">What can we rely on?</text>
    <text x="692" y="342" font-size="16" fill="#6e5e55">Accepted project knowledge</text>
    <text x="692" y="369" font-size="16" fill="#6e5e55">In your existing docs</text>
    <path d="M289 290h55" stroke="#8e7d74" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M607 290h55" stroke="#8e7d74" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="320" cy="265" r="13" fill="#f1e8e1"/>
    <text x="320" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#675043">1</text>
    <circle cx="638" cy="265" r="13" fill="#f1e8e1"/>
    <text x="638" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#675043">2</text>
    <path d="M798 413v37H162v-28" fill="none" stroke="#8e7d74" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M480 450v-28" fill="none" stroke="#8e7d74" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="480" y="475" text-anchor="middle" font-size="14" fill="#6e5e55">Accepted knowledge guides subsequent work</text>
    <path d="M36 487h888" stroke="#e8ddd7"/>
    <text x="36" y="519" font-size="15" font-weight="600" fill="#2b2421">1 / Findings + authorization</text>
    <text x="36" y="545" font-size="14" fill="#6e5e55">Present the evidence. Agree on the change.</text>
    <text x="490" y="519" font-size="15" font-weight="600" fill="#2b2421">2 / Verification + acceptance</text>
    <text x="490" y="545" font-size="14" fill="#6e5e55">Verify the change. Accept it. Update the docs.</text>
  </g>
</svg>
