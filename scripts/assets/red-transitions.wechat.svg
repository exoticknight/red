<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1500" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
  <title id="title">把这次说清楚的，留给下一次</title>
  <desc id="desc">公众号协作流程图。Research 经确认范围进入 Evolve；实施验证且结果被接受后更新 Document。已有 Document 为后续调查和改动提供依据。明确且获准的改动可以直接进入 Evolve，新的关键未知回到 Research。</desc>
  <rect width="720" height="1000" fill="#fffaf7"/>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <text x="40" y="49" font-size="18" font-weight="700" letter-spacing="2" fill="#a1252b">RED · 让协作接得上</text>
    <text x="40" y="103" font-size="35" font-weight="700" fill="#2b2421">把这次说清楚的，</text>
    <text x="40" y="151" font-size="35" font-weight="700" fill="#2b2421">留给下一次。</text>
    <text x="40" y="193" font-size="23" fill="#6e5e55">先读已有共识，再从当前需要出发。</text>

    <path d="M80 782H39V324H71 M39 565H71" fill="none" stroke="#aa9b91" stroke-width="2.5"/>
    <path d="M65 318L73 324L65 330 M65 559L73 565L65 571" fill="none" stroke="#aa9b91" stroke-width="2.5"/>

    <rect x="80" y="231" width="600" height="180" rx="18" fill="#ffffff" stroke="#dccfc7" stroke-width="1.5"/>
    <rect x="102" y="254" width="45" height="45" rx="12" fill="#f1e8e1"/>
    <text x="124.5" y="286" text-anchor="middle" font-size="29" font-weight="700" fill="#675043">R</text>
    <text x="163" y="286" font-size="23" font-weight="700" fill="#675043">Research · 还在弄清楚</text>
    <text x="103" y="343" font-size="29" font-weight="700" fill="#2b2421">还有什么需要调查？</text>
    <text x="103" y="382" font-size="24" fill="#6e5e55">留下问题、证据和建议，帮助判断。</text>

    <path d="M380 412V474" stroke="#a1252b" stroke-width="2.5"/>
    <path d="M373 466L380 475L387 466" fill="none" stroke="#a1252b" stroke-width="2.5"/>
    <text x="402" y="452" font-size="24" font-weight="700" fill="#a1252b">确认推进范围</text>

    <rect x="80" y="484" width="600" height="180" rx="18" fill="#ffffff" stroke="#d78788" stroke-width="1.5"/>
    <rect x="102" y="507" width="45" height="45" rx="12" fill="#c1121f"/>
    <text x="124.5" y="539" text-anchor="middle" font-size="29" font-weight="700" fill="#ffffff">E</text>
    <text x="163" y="539" font-size="23" font-weight="700" fill="#a1252b">Evolve · 正在一起做</text>
    <text x="103" y="596" font-size="29" font-weight="700" fill="#2b2421">这轮要把什么做出来？</text>
    <text x="103" y="635" font-size="24" fill="#6e5e55">实施、验证，随试用反馈持续调整。</text>

    <path d="M380 665V727" stroke="#a1252b" stroke-width="2.5"/>
    <path d="M373 719L380 728L387 719" fill="none" stroke="#a1252b" stroke-width="2.5"/>
    <text x="402" y="705" font-size="24" font-weight="700" fill="#a1252b">验证后，接受结果</text>

    <rect x="80" y="737" width="600" height="180" rx="18" fill="#ffffff" stroke="#b6c6ba" stroke-width="1.5"/>
    <rect x="102" y="760" width="45" height="45" rx="12" fill="#e6ece7"/>
    <text x="124.5" y="792" text-anchor="middle" font-size="29" font-weight="700" fill="#425a48">D</text>
    <text x="163" y="792" font-size="23" font-weight="700" fill="#425a48">Document · 已经说定</text>
    <text x="103" y="849" font-size="29" font-weight="700" fill="#2b2421">下次可以依据什么？</text>
    <text x="103" y="888" font-size="24" fill="#6e5e55">更新项目说明，为后续工作提供依据。</text>

    <text x="40" y="958" font-size="22" fill="#6e5e55">明确且获准 → 直接进入 E；新的关键未知 → 回到 R。</text>
  </g>
</svg>
